  <title id="title">Semi-ConTrans method schematic</title>
  <desc id="description">A medical image feeds CNN and Transformer branches, which teach one another and fuse multi-scale features.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M0 0 6 3 0 6z" fill="#52677c"/>
    </marker>
  </defs>
  <rect width="420" height="252" rx="12" fill="#f7f9fc"/>
  <g fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M211 58v12H103v18"/>
    <path d="M211 58v12h106v18"/>
    <path d="M103 129v47h107v17"/>
    <path d="M317 129v47H210"/>
  </g>
  <path d="M163 112h94" fill="none" stroke="#52677c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g stroke-width="1.5">
    <rect x="142" y="20" width="138" height="38" rx="8" fill="#fff" stroke="#9daec2"/>
    <rect x="51" y="88" width="104" height="41" rx="8" fill="#e2f1fb" stroke="#84afcd"/>
    <rect x="265" y="88" width="104" height="41" rx="8" fill="#eee9fa" stroke="#a695c4"/>
    <rect x="110" y="194" width="200" height="40" rx="8" fill="#e6f3eb" stroke="#8bb19b"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#21354a">
    <text x="211" y="44">Medical image</text>
    <text x="103" y="114">CNN</text>
    <text x="317" y="114">Transformer</text>
    <text x="210" y="140" font-size="12">Cross-teaching</text>
    <text x="210" y="219">Multi-scale feature fusion</text>
  </g>
</svg>
